name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Xcode)
    runs-on: macos-15
    strategy:
      matrix:
        scheme: [NKJMovieComposer-iOS, NKJMovieComposer-Mac]
        include:
          - scheme: NKJMovieComposer-iOS
            destination: "platform=iOS Simulator,name=iPhone 16,OS=latest"
          - scheme: NKJMovieComposer-Mac
            destination: "platform=macOS"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build & Test
        run: |
          xcodebuild \
            -workspace NKJMovieComposer.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            -configuration Debug \
            clean test \
            | xcbeautify

  spm:
    name: Swift Package Manager
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (SPM)
        run: swift build

      - name: Test (SPM)
        run: swift test

  pod-lint:
    name: CocoaPods Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Pod Lint
        run: pod lib lint --allow-warnings
